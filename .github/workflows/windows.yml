name: Windows V1 tests and portable build
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
          cache-dependency-path: requirements-build.txt
      - name: Test, freeze, and start actual Windows EXE
        shell: pwsh
        run: ./scripts/build_windows.ps1
      - name: Upload portable Windows application
        uses: actions/upload-artifact@v4
        with:
          name: ZugpferdArchiv-1.0.0-Windows-x64
          path: |
            dist/ZugpferdArchiv-1.0.0-Windows-x64.zip
            dist/ZugpferdArchiv-1.0.0-Windows-x64.zip.sha256
          if-no-files-found: error
          retention-days: 90
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-test-results
          path: test-results.xml
          if-no-files-found: ignore
